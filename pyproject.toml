[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tulip-scheme"
version = "0.1.0"
description = "A Scheme implementation in pure Python, aiming at R7RS-small"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tulip = "tulip.__main__:main"

[tool.setuptools]
packages = ["tulip"]

[tool.setuptools.package-data]
tulip = ["*.scm"]
